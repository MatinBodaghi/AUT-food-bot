<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>منوی تغذیهٔ امیرکبیر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1f24;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #14a37f;
    --accent-soft: #e6f6f1;
    --danger: #d64545;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c;
      --card: #212429;
      --text: #eef1f4;
      --muted: #9aa3ad;
      --line: #2c3036;
      --accent: #2ecc9a;
      --accent-soft: #17352c;
      --danger: #ff6b6b;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Vazirmatn, "Segoe UI", Tahoma, system-ui, sans-serif;
    font-size: 15px;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 12px 14px 24px; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner { max-width: 560px; margin: 0 auto; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .topbar h1 { font-size: 16px; margin: 0; flex: 1; }
  .credit { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .credit b { color: var(--text); font-size: 14px; }
  .week-tabs { display: flex; gap: 8px; margin: 14px 0 10px; }
  .week-tabs button {
    flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--muted);
    padding: 10px 6px; border-radius: 12px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .week-tabs button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 9px 14px; border-radius: 999px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .day {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-top: 12px; overflow: hidden;
  }
  .day-head {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: none; border: 0; color: var(--text); font-family: inherit;
    padding: 14px; font-size: 15px; cursor: pointer; text-align: right;
  }
  .day-head .date { color: var(--muted); font-size: 13px; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .badge.closed { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .day-body { display: none; padding: 0 14px 14px; }
  .day.open .day-body { display: block; }
  .day.open .chev { transform: rotate(180deg); }
  .chev { margin-inline-start: auto; color: var(--muted); transition: transform .15s; }
  .meal-title { color: var(--muted); font-size: 12px; margin: 10px 0 6px; }
  .option {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px;
  }
  .option .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: 0 0 auto; }
  .option.reserved .dot { background: var(--accent); }
  .option .body { flex: 1; min-width: 0; }
  .option .name { font-size: 14px; }
  .option .price { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .option button {
    border: 0; border-radius: 10px; padding: 8px 12px; font-family: inherit; font-size: 13px;
    cursor: pointer; background: var(--accent); color: #fff; white-space: nowrap;
  }
  .option button.cancel { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  .option button:disabled { opacity: .45; cursor: default; }
  .empty { text-align: center; color: var(--muted); padding: 28px 10px; }
  .skeleton { height: 84px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); margin-top: 12px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .tabs {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
    padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  }
  .tabs-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
  .tabs button {
    flex: 1; border: 0; background: none; color: var(--muted); font-family: inherit;
    font-size: 13px; padding: 10px; border-radius: 12px; cursor: pointer;
  }
  .tabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  input {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .primary {
    width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .primary:disabled { opacity: .55; }
  .linkbtn { background: none; border: 0; color: var(--danger); font-family: inherit; font-size: 14px; cursor: pointer; padding: 8px 0; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.8; margin-top: 10px; }
  .hidden { display: none !important; }
  .toast {
    position: fixed; inset-inline: 16px; bottom: 96px; z-index: 30;
    background: #111; color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 13px;
    opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none;
  }
  .toast.show { opacity: .95; transform: none; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <h1>🍱 تغذیهٔ امیرکبیر</h1>
    <div class="credit hidden" id="credit"></div>
  </div>
</div>

<div class="wrap">
  <section id="loading">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </section>

  <section id="login" class="hidden">
    <div class="card">
      <div style="font-size:17px;font-weight:700">ورود به سامانهٔ تغذیه</div>
      <div class="hint">اطلاعات فقط روی Workers خودت ذخیره می‌شود (رمزنگاری‌شده) و در چت نوشته نمی‌شود.</div>
      <label for="username">شمارهٔ دانشجویی</label>
      <input id="username" inputmode="numeric" autocomplete="username" />
      <label for="password">رمز عبور</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button class="primary" id="loginBtn">ورود</button>
      <div class="hint" id="loginError" style="color:var(--danger)"></div>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="week-tabs" id="weekTabs">
      <button data-week="pre">هفتهٔ قبل</button>
      <button data-week="cur" class="active">این هفته</button>
      <button data-week="next">هفتهٔ بعد</button>
    </div>
    <div class="chips" id="restaurants"></div>
    <div id="menu"></div>
  </section>

  <section id="account" class="hidden">
    <div class="card">
      <div style="font-weight:700">حساب</div>
      <div class="hint" id="accountInfo"></div>
      <button class="linkbtn" id="logoutBtn">خروج و پاک کردن اطلاعات</button>
    </div>
  </section>
</div>

<div class="tabs">
  <div class="tabs-inner">
    <button data-tab="menu" class="active">منو</button>
    <button data-tab="account">حساب</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram?.WebApp;
  const $ = (id) => document.getElementById(id);
  const state = { week: "cur", restId: null, restaurants: [], busy: false };

  if (!tg) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;line-height:2">این صفحه فقط داخل تلگرام باز می‌شود.</div>';
  } else {
    tg.ready();
    tg.expand();
    applyTheme();
  }

  function applyTheme() {
    const p = tg?.themeParams || {};
    const root = document.documentElement.style;
    if (p.bg_color) root.setProperty("--bg", p.bg_color);
    if (p.secondary_bg_color) root.setProperty("--card", p.secondary_bg_color);
    if (p.text_color) root.setProperty("--text", p.text_color);
    if (p.hint_color) root.setProperty("--muted", p.hint_color);
    if (p.button_color) root.setProperty("--accent", p.button_color);
    if (p.destructive_text_color) root.setProperty("--danger", p.destructive_text_color);
    if (tg?.colorScheme === "dark") root.setProperty("--bg", p.bg_color || "#17191c");
  }

  async function api(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: {
        "X-Telegram-Init-Data": tg.initData,
        ...(options.body ? { "content-type": "application/json" } : {}),
      },
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const error = new Error(data.error || "خطای ناشناخته");
      error.code = data.code;
      error.status = response.status;
      throw error;
    }
    return data;
  }

  const fmtPrice = (value) =>
    value === null || value === undefined
      ? "—"
      : Math.abs(value).toLocaleString("fa-IR") + " ریال";

  let toastTimer;
  function toast(message) {
    const el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
  }

  function show(section) {
    for (const id of ["loading", "login", "app", "account"]) {
      $(id).classList.toggle("hidden", id !== section);
    }
    const tab = section === "app" ? "menu" : section;
    document.querySelectorAll(".tabs button").forEach((button) => {
      button.classList.toggle("active", button.dataset.tab === tab);
    });
    // The tab bar only makes sense once the user is inside the app.
    document.querySelector(".tabs").classList.toggle("hidden", section === "login" || section === "loading");
  }

  async function boot() {
    try {
      const me = await api("/api/me");
      $("accountInfo").textContent =
        (me.user.name || me.user.username || "کاربر") +
        (me.loggedIn ? " — وارد سامانهٔ تغذیه هستی." : " — هنوز وارد نشده‌ای.");
      if (!me.loggedIn) return show("login");
      await loadRestaurants();
      show("app");
    } catch (error) {
      show("login");
      $("loginError").textContent = error.message;
    }
  }

  async function loadRestaurants() {
    const data = await api("/api/restaurants");
    state.restaurants = data.restaurants;
    state.restId = state.restId ?? data.restaurants[0]?.id ?? null;

    const container = $("restaurants");
    container.innerHTML = "";
    for (const restaurant of data.restaurants) {
      const chip = document.createElement("button");
      chip.className = "chip" + (restaurant.id === state.restId ? " active" : "");
      chip.textContent = restaurant.name;
      chip.onclick = () => {
        state.restId = restaurant.id;
        document.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        loadMenu();
      };
      container.appendChild(chip);
    }
    await loadMenu();
  }

  function skeletons() {
    $("menu").innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  }

  async function loadMenu() {
    if (!state.restId) return;
    skeletons();
    try {
      const data = await api(`/api/menu?restId=${state.restId}&week=${state.week}`);
      $("credit").classList.remove("hidden");
      $("credit").innerHTML = "اعتبار: <b>" + fmtPrice(data.credit) + "</b>";
      renderMenu(data);
    } catch (error) {
      if (error.code === "login_required") return show("login");
      $("menu").innerHTML = '<div class="empty">' + error.message + "</div>";
    }
  }

  function mealLabel(type) {
    return { lunch: "ناهار", dinner: "شام", breakfast: "صبحانه" }[type] || type;
  }

  function renderMenu(data) {
    const menu = $("menu");
    menu.innerHTML = "";

    if (data.range) {
      const range = document.createElement("div");
      range.className = "hint";
      range.style.margin = "2px 2px 4px";
      range.textContent = "بازهٔ " + data.range.start + " تا " + data.range.end;
      menu.appendChild(range);
    }
    if (data.available === false) {
      const note = document.createElement("div");
      note.className = "hint";
      note.style.margin = "0 2px 8px";
      note.textContent = "این هفته در سامانه موجود نیست؛ نزدیک‌ترین هفته نمایش داده می‌شود.";
      menu.appendChild(note);
    }
    const today = new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn", {
      timeZone: "Asia/Tehran", year: "numeric", month: "2-digit", day: "2-digit",
    }).formatToParts(new Date()).reduce((acc, part) => {
      acc[part.type] = part.value; return acc;
    }, {});
    const todayKey = `${String(today.year).replace(/\D/g, "")}/${today.month}/${today.day}`;

    const days = data.days.filter((day) => day.meals.length > 0);
    if (!days.length) {
      menu.innerHTML = '<div class="empty">برای این هفته غذایی ثبت نشده است.</div>';
      return;
    }

    for (const day of days) {
      const card = document.createElement("div");
      card.className = "day" + (day.date === todayKey ? " open" : "");

      const options = day.meals.flatMap((meal) => meal.options);
      const openCount = options.filter((option) => option.selectable).length;
      const reservedCount = options.filter((option) => option.reserved).length;

      const head = document.createElement("button");
      head.className = "day-head";
      head.innerHTML =
        '<span>' + day.dayName + '</span><span class="date">' + day.date + "</span>" +
        '<span class="badge' + (openCount ? "" : " closed") + '">' +
        (openCount ? openCount + " قابل تغییر" : reservedCount ? reservedCount + " رزرو" : "بسته") +
        '</span><span class="chev">⌄</span>';
      head.onclick = () => card.classList.toggle("open");
      card.appendChild(head);

      const body = document.createElement("div");
      body.className = "day-body";
      for (const meal of day.meals) {
        const title = document.createElement("div");
        title.className = "meal-title";
        title.textContent = mealLabel(meal.type);
        body.appendChild(title);

        for (const option of meal.options) {
          body.appendChild(renderOption(day.date, meal.type, option));
        }
      }
      card.appendChild(body);
      menu.appendChild(card);
    }
  }

  function renderOption(date, mealType, option) {
    const row = document.createElement("div");
    row.className = "option" + (option.reserved ? " reserved" : "");

    const dot = document.createElement("span");
    dot.className = "dot";

    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML = '<div class="name"></div><div class="price"></div>';
    body.querySelector(".name").textContent = option.name;
    body.querySelector(".price").textContent =
      fmtPrice(option.price) + (option.reserved ? " — رزرو شده" : "");

    const action = option.reserved ? "cancel" : "reserve";
    const button = document.createElement("button");
    button.textContent = option.reserved ? "لغو" : "رزرو";
    if (option.reserved) button.className = "cancel";
    button.disabled = !option.selectable || state.busy;
    button.onclick = () => submit(button, {
      restId: state.restId, week: state.week, date, baseId: option.baseId, action,
      name: option.name, mealType,
    });

    row.append(dot, body, button);
    return row;
  }

  async function submit(button, payload) {
    const verb = payload.action === "cancel" ? "لغو رزرو" : "رزرو";
    const confirmed = await new Promise((resolve) => {
      if (tg?.showConfirm) tg.showConfirm(`${verb} «${payload.name}»؟`, resolve);
      else resolve(confirm(`${verb} «${payload.name}»؟`));
    });
    if (!confirmed) return;

    state.busy = true;
    button.disabled = true;
    button.textContent = "…";
    try {
      const result = await api("/api/reserve", {
        method: "POST",
        body: JSON.stringify(payload),
      });
      toast(result.verified ? "✅ " + verb + " انجام شد" : "⚠️ تغییر تأیید نشد");
      if (result.credit !== undefined) {
        $("credit").innerHTML = "اعتبار: <b>" + fmtPrice(result.credit) + "</b>";
      }
      await loadMenu();
    } catch (error) {
      toast("❌ " + error.message);
      button.disabled = false;
      button.textContent = payload.action === "cancel" ? "لغو" : "رزرو";
    } finally {
      state.busy = false;
    }
  }

  $("weekTabs").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-week]");
    if (!button) return;
    state.week = button.dataset.week;
    document.querySelectorAll("#weekTabs button").forEach((b) => b.classList.remove("active"));
    button.classList.add("active");
    loadMenu();
  });

  document.querySelector(".tabs").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-tab]");
    if (!button) return;
    show(button.dataset.tab === "menu" ? "app" : "account");
  });

  $("loginBtn").onclick = async () => {
    const button = $("loginBtn");
    button.disabled = true;
    button.textContent = "در حال ورود…";
    $("loginError").textContent = "";
    try {
      await api("/api/login", {
        method: "POST",
        body: JSON.stringify({ username: $("username").value.trim(), password: $("password").value }),
      });
      $("password").value = "";
      await loadRestaurants();
      show("app");
    } catch (error) {
      $("loginError").textContent = error.message;
    } finally {
      button.disabled = false;
      button.textContent = "ورود";
    }
  };

  $("logoutBtn").onclick = async () => {
    if (!confirm("اطلاعات ذخیره‌شده پاک شود؟")) return;
    await api("/api/logout", { method: "POST" }).catch(() => {});
    location.reload();
  };

  boot();
</script>
</body>
</html>
