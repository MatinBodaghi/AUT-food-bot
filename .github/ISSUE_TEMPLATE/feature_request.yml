name: Feature request
description: Suggest an idea or improvement for the bot.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check the [roadmap](https://github.com/MatinBodaghi/AUT-food-bot#roadmap) and existing issues first.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I checked the roadmap in the README.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or frustration behind the request.
      placeholder: As a student, I want ... so that ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the bot to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AUT client / CAS login
        - Menu or reservation parsing
        - Telegram bot / commands
        - Persian formatting / dates
        - Crypto / secrets
        - Tooling / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this feature.
